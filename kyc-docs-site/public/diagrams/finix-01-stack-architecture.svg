  <rect x="30" y="820" width="1400" height="86" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="842" text-anchor="start" font-size="11.5" font-weight="700" fill="#92400e">Single-owner rule</text>
  <text x="48" y="861" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">The order book (Saral OMS), the margin number at the moment of release (Saral RMS) and the ledger of record (SecMark back office) have exactly one owner each.</text>
  <text x="48" y="877" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">Everything else in the stack may be shadowed, cross-checked or reconciled. These three may not — dual ownership of any of them produces incidents reconciliation cannot repair.</text>
  <text x="48" y="896" text-anchor="start" font-size="9.5" font-weight="400" fill="#92400e">Vendor names are used as the named stack for this manual, from public material. Not vendor documentation, not an endorsement; configure against the contract and the circular.</text>
</svg>
