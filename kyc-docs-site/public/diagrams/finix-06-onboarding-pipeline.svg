<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 820" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1460" height="820" fill="white"/>
  <rect x="0" y="0" width="1460" height="60" fill="url(#headerGrad)"/>
  <text x="730.0" y="27" text-anchor="middle" fill="white" font-size="19" font-weight="700">Finix onboarding pipeline</text>
  <text x="730.0" y="47" text-anchor="middle" fill="#94a3b8" font-size="11.5">Digio, CVL KRA, CERSAI CKYCRR 2.0, C-Safe screening, exchange UCC and demat — and the gates between them</text>
  <rect x="30" y="70" width="1400" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="48" y="81" width="15" height="15" rx="4" fill="#3b82f6"/>
  <text x="69" y="93" font-size="10.5" fill="#475569">Broker-owned journey</text>
  <rect x="214.0" y="81" width="15" height="15" rx="4" fill="#8b5cf6"/>
  <text x="235.0" y="93" font-size="10.5" fill="#475569">Vendor / registry</text>
  <rect x="359.0" y="81" width="15" height="15" rx="4" fill="#dc2626"/>
  <text x="380.0" y="93" font-size="10.5" fill="#475569">Blocking gate</text>
  <rect x="476.0" y="81" width="15" height="15" rx="4" fill="#475569"/>
  <text x="497.0" y="93" font-size="10.5" fill="#475569">Market infrastructure</text>
  <rect x="649.0" y="81" width="15" height="15" rx="4" fill="#16a34a"/>
  <text x="670.0" y="93" font-size="10.5" fill="#475569">Record</text>
  <rect x="30" y="126" width="1400" height="150" rx="10" fill="#f8fbff" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="145" font-size="11.5" font-weight="700" fill="#1e40af" letter-spacing="0.6">BROKER-OWNED JOURNEY</text>
  <text x="44" y="160" font-size="9.5" fill="#64748b">The firm owns screens and conversion; vendors own primitives</text>
  <rect x="52" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Mobile + PAN</text>
  <text x="158.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Entry</text>
  <line x1="264" y1="199" x2="278" y2="199" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="280" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="386.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">DigiLocker / Aadhaar</text>
  <text x="386.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Digio</text>
  <line x1="492" y1="199" x2="506" y2="199" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="508" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Face match + liveness</text>
  <text x="614.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Digio</text>
  <line x1="720" y1="199" x2="734" y2="199" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="736" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="842.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Bank verification</text>
  <text x="842.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Penny / API</text>
  <line x1="948" y1="199" x2="962" y2="199" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="964" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Profile and preferences</text>
  <text x="1070.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Broker</text>
  <line x1="1176" y1="199" x2="1190" y2="199" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1192" y="168" width="212" height="62" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1298.0" y="196.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">eSign + DDPI + eStamp</text>
  <text x="1298.0" y="210.5" text-anchor="middle" font-size="9" fill="#64748b">Digio</text>
  <rect x="30" y="300" width="1400" height="170" rx="10" fill="#fbf7ff" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="319" font-size="11.5" font-weight="700" fill="#5b21b6" letter-spacing="0.6">REGISTRIES AND SCREENING</text>
  <text x="44" y="334" font-size="9.5" fill="#64748b">Parallel where possible; each has its own failure branch</text>
  <rect x="56" y="344" width="300" height="68" rx="9" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.0" y="375.5" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">CVL KRA</text>
  <text x="206.0" y="389.5" text-anchor="middle" font-size="9" fill="#64748b">Push data + images; status; fetch</text>
  <rect x="380" y="344" width="300" height="68" rx="9" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.0" y="375.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">CERSAI CKYCRR 2.0</text>
  <text x="530.0" y="389.5" text-anchor="middle" font-size="9" fill="#64748b">Real-time API · OTP consent · masked Aadhaar</text>
  <rect x="704" y="344" width="300" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.0" y="375.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">SecMark C-Safe</text>
  <text x="854.0" y="389.5" text-anchor="middle" font-size="9" fill="#64748b">PEP · UNSC · OFAC · SEBI — 50+ lists</text>
  <path d="M 206 418 L 206 436 L 1216 436 L 1216 418" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-violet)"/>
  <rect x="1028" y="344" width="376" height="68" rx="9" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1216.0" y="375.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">Four-KRA interop</text>
  <text x="1216.0" y="389.5" text-anchor="middle" font-size="9" fill="#64748b">A query to one returns the record; a duplicate upload is rejected — download instead</text>
  <line x1="206" y1="236" x2="206" y2="340" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-violet)"/>
  <line x1="530" y1="236" x2="530" y2="340" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-violet)"/>
  <line x1="854" y1="236" x2="854" y2="340" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arrow-violet)"/>
  <text x="1140" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Unresolved screening hit blocks activation — never auto-clear</text>
  <rect x="30" y="494" width="1400" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="513" font-size="11.5" font-weight="700" fill="#1e293b" letter-spacing="0.6">REGISTRATION AND ACCOUNTS</text>
  <text x="44" y="528" font-size="9.5" fill="#64748b">Partial success is the failure mode</text>
  <rect x="56" y="538" width="300" height="68" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.0" y="569.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Exchange UCC</text>
  <text x="206.0" y="583.5" text-anchor="middle" font-size="9" fill="#64748b">NSE · BSE · MCX, per segment</text>
  <rect x="380" y="538" width="300" height="68" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.0" y="569.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Demat — CDSL</text>
  <text x="530.0" y="583.5" text-anchor="middle" font-size="9" fill="#64748b">Hours via API</text>
  <rect x="704" y="538" width="300" height="68" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="854.0" y="569.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e293b">Demat — NSDL</text>
  <text x="854.0" y="583.5" text-anchor="middle" font-size="9" fill="#64748b">~15 days via batch — the bottleneck</text>
  <rect x="1028" y="538" width="376" height="68" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1216.0" y="569.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">SecMark client master</text>
  <text x="1216.0" y="583.5" text-anchor="middle" font-size="9" fill="#64748b">Three-way recon: onboarding · OMS · back office</text>
  <line x1="206" y1="418" x2="206" y2="534" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="418" x2="530" y2="534" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1010" y1="572" x2="1024" y2="572" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="30" y="672" width="1400" height="124" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="48" y="694" text-anchor="start" font-size="11.5" font-weight="700" fill="#991b1b">Four gates before a client can trade</text>
  <text x="48" y="714" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">1.  Screening resolved — an unresolved hit blocks activation, and the list version used is recorded with the result.</text>
  <text x="48" y="732" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">2.  UCC registered on the exchange and segment — a partial batch leaves a client tradeable on one exchange and not another.</text>
  <text x="48" y="750" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">3.  Demat active before any delivery-creating trade — CDSL activates in hours, NSDL in roughly fifteen days, which sets what onboarding can promise.</text>
  <text x="48" y="768" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">4.  Client master present in onboarding, OMS and back office — reconciled daily; a client in one and not another must not trade.</text>
  <text x="48" y="788" text-anchor="start" font-size="9.5" font-weight="700" fill="#991b1b">A signature that exists at the vendor but not with the broker is the dangerous state: the account looks incomplete and is legally complete. Reconcile retrieved artefacts daily.</text>
</svg>
