<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 760" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1460" height="760" fill="white"/>
  <rect x="0" y="0" width="1460" height="60" fill="url(#headerGrad)"/>
  <text x="730.0" y="27" text-anchor="middle" fill="white" font-size="19" font-weight="700">Finix setup — the dependency graph</text>
  <text x="730.0" y="47" text-anchor="middle" fill="#94a3b8" font-size="11.5">What can run in parallel, what only looks parallel, and the strictly sequential spine</text>
  <rect x="30" y="70" width="1400" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="48" y="81" width="15" height="15" rx="4" fill="#dc2626"/>
  <text x="69" y="93" font-size="10.5" fill="#475569">Sequential spine</text>
  <rect x="186.0" y="81" width="15" height="15" rx="4" fill="#d97706"/>
  <text x="207.0" y="93" font-size="10.5" fill="#475569">Falsely parallel</text>
  <rect x="324.0" y="81" width="15" height="15" rx="4" fill="#16a34a"/>
  <text x="345.0" y="93" font-size="10.5" fill="#475569">Genuinely parallel</text>
  <line x1="476.0" y1="89" x2="518.0" y2="89" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="525.0" y="93" font-size="10.5" fill="#475569">Blocks</text>
  <rect x="48" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Net worth</text>
  <text x="136.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Capital in cash; deductions planned</text>
  <line x1="224" y1="174" x2="244" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="244" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="332.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">SEBI registration</text>
  <text x="332.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Via the exchange, 2026 regulations</text>
  <line x1="420" y1="174" x2="440" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="440" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Exchange recommendation</text>
  <text x="528.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Forwarded within 30 days</text>
  <line x1="616" y1="174" x2="636" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="636" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="724.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Membership activated</text>
  <text x="724.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Member code issued</text>
  <line x1="812" y1="174" x2="832" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="832" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="920.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">User identifiers</text>
  <text x="920.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Reported before any order routes</text>
  <line x1="1008" y1="174" x2="1028" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="1028" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Certification</text>
  <text x="1116.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Per exchange, segment and facility</text>
  <line x1="1204" y1="174" x2="1224" y2="174" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="1224" y="140" width="176" height="68" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="1312.0" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">First live order</text>
  <text x="1312.0" y="185.5" text-anchor="middle" font-size="9" fill="#64748b">Narrow, then widen</text>
  <rect x="30" y="246" width="700" height="212" rx="10" fill="#fffbeb" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="265" font-size="11.5" font-weight="700" fill="#92400e" letter-spacing="0.6">FALSELY PARALLEL</text>
  <text x="44" y="280" font-size="9.5" fill="#64748b">Looks independent; is not</text>
  <rect x="56" y="288" width="648" height="36" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.0" y="310.0" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Connectivity provisioning  —  Needs membership</text>
  <rect x="56" y="330" width="648" height="36" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.0" y="352.0" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Clearing bank account  —  Needs membership and the clearing arrangement</text>
  <rect x="56" y="372" width="648" height="36" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.0" y="394.0" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Depository participation  —  Own net worth and infrastructure tests</text>
  <rect x="56" y="414" width="648" height="36" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.0" y="436.0" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Certification slots  —  Published exchange calendar, not yours</text>
  <rect x="760" y="246" width="670" height="212" rx="10" fill="#f6fdf8" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="774" y="265" font-size="11.5" font-weight="700" fill="#166534" letter-spacing="0.6">GENUINELY PARALLEL</text>
  <text x="774" y="280" font-size="9.5" fill="#64748b">Start on day one; all have long lead times</text>
  <rect x="786" y="288" width="618" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.0" y="308.0" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Vendor contracting  —  Integration kits before signature</text>
  <rect x="786" y="324" width="618" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.0" y="344.0" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Infrastructure procurement  —  Leased lines, sites, DR</text>
  <rect x="786" y="360" width="618" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.0" y="380.0" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Hiring and NISM certification  —  Three-year validity, renewal calendar</text>
  <rect x="786" y="396" width="618" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.0" y="416.0" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Back office and onboarding build  —  Independent of registration</text>
  <rect x="786" y="432" width="618" height="32" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.0" y="452.0" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Compliance policy set  —  Day-one artefacts</text>
  <rect x="30" y="486" width="1400" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="508" text-anchor="start" font-size="11.5" font-weight="700" fill="#1e293b">The long poles are rarely the software</text>
  <text x="48" y="528" text-anchor="start" font-size="10" font-weight="400" fill="#475569">Net worth certification · exchange membership approval · clearing bank account opening · depository participant admission · leased-line provisioning · exchange certification slots.</text>
  <text x="48" y="546" text-anchor="start" font-size="10" font-weight="400" fill="#475569">None of these compress with more engineers. Internal work can be compressed; a provider&#x27;s installation queue cannot.</text>
  <text x="48" y="570" text-anchor="start" font-size="10" font-weight="700" fill="#1e293b">Scheduling rule: start every third-party dependency the day it becomes orderable, even if the internal work that consumes it is weeks away.</text>
  <rect x="30" y="616" width="1400" height="110" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="638" text-anchor="start" font-size="11.5" font-weight="700" fill="#92400e">Two decisions that set the capital number</text>
  <text x="48" y="658" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">Clearing: trading member ₹1 cr · self-clearing ₹5 cr · clearing ₹15 cr · professional clearing ₹50 cr. Depository participation for a stock broker also lands at ₹5 cr — take the two together.</text>
  <text x="48" y="676" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">Algorithmic capability: NSE base minimum capital is ₹10L prop-only / ₹15L client-only / ₹25L both — but ₹50L for any member with algorithms. An API offering is an algorithm offering.</text>
  <text x="48" y="700" text-anchor="start" font-size="9.5" font-weight="400" fill="#92400e">Net worth is computed after deducting fixed assets, pledged securities, prepaid expenses, intangibles and 30% of marketable securities — so buying servers reduces it.</text>
</svg>
