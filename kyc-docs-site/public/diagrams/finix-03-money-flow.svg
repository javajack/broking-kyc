  <text x="750.0" y="27" text-anchor="middle" fill="white" font-size="19" font-weight="700">Finix money flow</text>
  <text x="750.0" y="47" text-anchor="middle" fill="#94a3b8" font-size="11.5">Collection into the upstreaming nodal account, disbursement from the downstreaming nodal account, treasury to the clearing corporation, and end-of-day upstreaming</text>
  <rect x="30" y="70" width="1440" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
