  <rect x="116.0" y="81" width="15" height="15" rx="4" fill="#ea580c"/>
  <text x="137.0" y="93" font-size="10.5" fill="#475569">Payment rails</text>
  <rect x="233.0" y="81" width="15" height="15" rx="4" fill="#d97706"/>
  <text x="254.0" y="93" font-size="10.5" fill="#475569">Client money</text>
  <rect x="343.0" y="81" width="15" height="15" rx="4" fill="#94a3b8"/>
  <text x="364.0" y="93" font-size="10.5" fill="#475569">Own money</text>
  <rect x="432.0" y="81" width="15" height="15" rx="4" fill="#475569"/>
  <text x="453.0" y="93" font-size="10.5" fill="#475569">Market infrastructure</text>
  <rect x="605.0" y="81" width="15" height="15" rx="4" fill="#dc2626"/>
  <text x="626.0" y="93" font-size="10.5" fill="#475569">Capacity gate</text>
  <line x1="722.0" y1="89" x2="764.0" y2="89" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="771.0" y="93" font-size="10.5" fill="#475569">Prohibited</text>
  <rect x="30" y="126" width="700" height="250" rx="10" fill="#fff8f1" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="145" font-size="11.5" font-weight="700" fill="#9a3412" letter-spacing="0.6">COLLECTION</text>
  <text x="44" y="160" font-size="9.5" fill="#64748b">Every rupee here is the client&#x27;s, not the firm&#x27;s</text>
  <rect x="56" y="168" width="180" height="60" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.0" y="195.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">Client</text>
  <text x="146.0" y="209.5" text-anchor="middle" font-size="9" fill="#64748b">Own bank account only</text>
  <rect x="268" y="160" width="200" height="76" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="368.0" y="195.5" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">Razorpay</text>
  <text x="368.0" y="209.5" text-anchor="middle" font-size="9" fill="#64748b">PG · UPI @valid…brk · Smart Collect VA</text>
  <rect x="500" y="160" width="200" height="76" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="600.0" y="195.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">A1 — USCNB</text>
  <text x="600.0" y="209.5" text-anchor="middle" font-size="9" fill="#64748b">“Name of SB/CM – USCNB account”</text>
  <line x1="240" y1="198" x2="264" y2="198" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="472" y1="198" x2="496" y2="198" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="600" y="150" text-anchor="middle" font-size="9" font-weight="400" fill="#9a3412">settlement.processed + UTR</text>
  <rect x="56" y="262" width="180" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.0" y="287.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Third party</text>
  <text x="146.0" y="301.5" text-anchor="middle" font-size="9" fill="#64748b">Not the client</text>
  <line x1="240" y1="290" x2="300" y2="290" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="380" y="294" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">blocked on payer mismatch</text>
  <rect x="56" y="330" width="180" height="36" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.0" y="352.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Cash</text>
  <line x1="240" y1="348" x2="300" y2="348" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="400" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">prohibited — regulation 20(d), no code path</text>
  <rect x="770" y="160" width="250" height="76" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="895.0" y="195.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">Capacity gate</text>
  <text x="895.0" y="209.5" text-anchor="middle" font-size="9" fill="#64748b">Confirmed good funds only</text>
  <line x1="704" y1="198" x2="766" y2="198" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="1060" y="160" width="400" height="76" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1260.0" y="195.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Saral RMS — available exposure</text>
  <text x="1260.0" y="209.5" text-anchor="middle" font-size="9" fill="#64748b">Authorised ≠ captured ≠ settled ≠ confirmed</text>
  <line x1="1024" y1="198" x2="1056" y2="198" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="760" y="268" width="700" height="230" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="774" y="287" font-size="11.5" font-weight="700" fill="#1e293b" letter-spacing="0.6">TREASURY AND THE MARKET</text>
  <text x="774" y="302" font-size="9.5" fill="#64748b">Deadlines set by the bank, not the exchange</text>
  <rect x="786" y="312" width="200" height="68" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.0" y="343.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">A3 — clearing</text>
  <text x="886.0" y="357.5" text-anchor="middle" font-size="9" fill="#64748b">Designated clearing bank</text>
  <rect x="1020" y="312" width="200" height="68" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="343.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Clearing corp</text>
  <text x="1120.0" y="357.5" text-anchor="middle" font-size="9" fill="#64748b">NCL · ICCL · MCXCCL</text>
  <rect x="1254" y="312" width="190" height="68" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="1349.0" y="343.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Exchange</text>
  <text x="1349.0" y="357.5" text-anchor="middle" font-size="9" fill="#64748b">Margin · settlement</text>
  <line x1="990" y1="346" x2="1016" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1224" y1="346" x2="1250" y2="346" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 640 240 L 640 346 L 782 346" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="650" y="262" text-anchor="start" font-size="9" font-weight="400" fill="#92400e">client obligations</text>
  <rect x="786" y="410" width="658" height="60" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.0" y="437.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">End-of-day upstreaming — cash · lien on FDR · pledge of MFOS units</text>
  <text x="1115.0" y="451.5" text-anchor="middle" font-size="9" fill="#64748b">Clear credit balances leave the broker overnight</text>
  <path d="M 600 240 L 600 440 L 782 440" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="612" y="462" text-anchor="start" font-size="9" font-weight="400" fill="#166534">clear credit balances</text>
  <rect x="30" y="530" width="1430" height="220" rx="10" fill="#fff8f1" stroke="#e2e8f0" stroke-dasharray="5,4"/>
  <text x="44" y="549" font-size="11.5" font-weight="700" fill="#9a3412" letter-spacing="0.6">DISBURSEMENT</text>
  <text x="44" y="564" font-size="9.5" fill="#64748b">Only from DSCNB, funded same day from the clearing corporation</text>
  <rect x="1254" y="574" width="190" height="64" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="1349.0" y="603.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Clearing corp</text>
  <text x="1349.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">Pay-out received</text>
  <rect x="1020" y="574" width="200" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="603.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">A3 — clearing</text>
  <text x="1120.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">Same day</text>
  <rect x="770" y="574" width="220" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="880.0" y="603.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">A2 — DSCNB</text>
  <text x="880.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">“Name of SB/CM – DSCNB account”</text>
  <rect x="520" y="574" width="210" height="64" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="625.0" y="603.5" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">RazorpayX Payouts</text>
  <text x="625.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">UPI · IMPS · NEFT · RTGS</text>
  <rect x="290" y="574" width="190" height="64" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.0" y="603.5" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Client</text>
  <text x="385.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">Verified bank account</text>
  <line x1="1250" y1="606" x2="1224" y2="606" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1016" y1="606" x2="994" y2="606" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <line x1="766" y1="606" x2="734" y2="606" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="516" y1="606" x2="484" y2="606" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="60" y="574" width="200" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="603.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">SecMark — authorise</text>
  <text x="160.0" y="617.5" text-anchor="middle" font-size="9" fill="#64748b">Clear settled balance only</text>
  <path d="M 160 638 L 160 690 L 620 690 L 620 642" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <text x="390" y="706" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">authorisation precedes submission — idempotency reference on every payout</text>
  <rect x="60" y="410" width="480" height="60" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="300.0" y="437.5" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">A5 — own operating account</text>
  <text x="300.0" y="451.5" text-anchor="middle" font-size="9" fill="#64748b">Brokerage and charges, after computation of amounts actually due</text>
  <path d="M 520 240 L 520 388 L 300 388 L 300 406" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="330" y="382" text-anchor="start" font-size="9" font-weight="400" fill="#475569">computed, not swept</text>
  <rect x="30" y="772" width="1440" height="110" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="794" text-anchor="start" font-size="11.5" font-weight="700" fill="#92400e">Three rules this diagram exists to enforce</text>
  <text x="48" y="814" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">1.  The gateway settles into A1, not the firm&#x27;s operating account. The merchant default is wrong for a broker and is a segregation breach on every pay-in.</text>
  <text x="48" y="832" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">2.  Client pay-outs leave only from A2, funded the same day from the clearing corporation or clearing member — never from a pool.</text>
  <text x="48" y="850" text-anchor="start" font-size="10" font-weight="400" fill="#78350f">3.  Capacity is granted on confirmed good funds. Authorised, captured and settled-to-gateway create no trading capacity.</text>
  <text x="48" y="872" text-anchor="start" font-size="9.5" font-weight="400" fill="#92400e">Client money may not be commingled with the broker&#x27;s own funds or used for proprietary purposes — regulation 18(2)(c), SEBI (Stock Brokers) Regulations, 2026.</text>
</svg>
