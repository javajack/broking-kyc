<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1160" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1520" height="1160" fill="white"/>
  <rect x="0" y="0" width="1520" height="60" fill="url(#headerGrad)"/>
  <text x="760.0" y="27" text-anchor="middle" fill="white" font-size="19" font-weight="700">The Finix trading day</text>
  <text x="760.0" y="47" text-anchor="middle" fill="#94a3b8" font-size="11.5">Begin-of-day gates, the sessions, end-of-day, and the commodity close that runs four hours later</text>
  <rect x="30" y="70" width="1460" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="48" y="81" width="15" height="15" rx="4" fill="#d97706"/>
  <text x="69" y="93" font-size="10.5" fill="#475569">Gate — abort if unmet</text>
  <rect x="221.0" y="81" width="15" height="15" rx="4" fill="#3b82f6"/>
  <text x="242.0" y="93" font-size="10.5" fill="#475569">Session</text>
  <rect x="296.0" y="81" width="15" height="15" rx="4" fill="#dc2626"/>
  <text x="317.0" y="93" font-size="10.5" fill="#475569">Risk</text>
  <rect x="350.0" y="81" width="15" height="15" rx="4" fill="#16a34a"/>
  <text x="371.0" y="93" font-size="10.5" fill="#475569">Record</text>
  <rect x="418.0" y="81" width="15" height="15" rx="4" fill="#ea580c"/>
  <text x="439.0" y="93" font-size="10.5" fill="#475569">Money</text>
  <rect x="479.0" y="81" width="15" height="15" rx="4" fill="#475569"/>
  <text x="500.0" y="93" font-size="10.5" fill="#475569">Market event</text>
  <rect x="30" y="130" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="white">07:30</text>
  <rect x="176" y="130" width="1314" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="156" text-anchor="start" font-size="11" font-weight="700" fill="#92400e">BOD gates</text>
  <text x="291.8" y="156" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Masters · risk parameters · ban list · surveillance lists · collateral and ledger as-of — any miss aborts the open</text>
  <rect x="30" y="177" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="white">08:15</text>
  <rect x="176" y="177" width="1314" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="203" text-anchor="start" font-size="11" font-weight="700" fill="#92400e">Connectivity</text>
  <text x="316.4" y="203" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Sessions established per exchange and per BSE segment instance; sequence continuity verified</text>
  <rect x="30" y="224" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="white">08:45</text>
  <rect x="176" y="224" width="1314" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="250" text-anchor="start" font-size="11" font-weight="700" fill="#991b1b">Capacity</text>
  <text x="283.6" y="250" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Limits resolved, available exposure computed per client, firm-level utilisation baselined</text>
  <rect x="30" y="271" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="white">09:00</text>
  <rect x="176" y="271" width="1314" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="297" text-anchor="start" font-size="11" font-weight="700" fill="#1e40af">AMO release</text>
  <text x="308.2" y="297" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Queued after-market orders released; release verified, not assumed</text>
  <rect x="30" y="318" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="white">09:00–09:15</text>
  <rect x="176" y="318" width="1314" height="42" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="344" text-anchor="start" font-size="11" font-weight="700" fill="#1e293b">Pre-open</text>
  <text x="283.6" y="344" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Order entry, modification, cancellation, price discovery — distinct behaviour from continuous trading</text>
  <rect x="30" y="365" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="391" text-anchor="middle" font-size="11" font-weight="700" fill="white">09:15</text>
  <rect x="176" y="365" width="1314" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="391" text-anchor="start" font-size="11" font-weight="700" fill="#1e40af">Continuous session</text>
  <text x="365.6" y="391" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Equity and derivatives; risk monitoring, treasury, pay-in attribution, surveillance triage</text>
  <rect x="30" y="412" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="white">11:00–15:00</text>
  <rect x="176" y="412" width="1314" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="438" text-anchor="start" font-size="11" font-weight="700" fill="#991b1b">Peak-margin snapshots</text>
  <text x="390.2" y="438" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Four random windows: 11:00–11:30 · 12:30–13:00 · 13:30–14:00 · 14:30–15:00</text>
  <rect x="30" y="459" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="white">15:30</text>
  <rect x="176" y="459" width="1314" height="42" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="485" text-anchor="start" font-size="11" font-weight="700" fill="#1e293b">Close</text>
  <text x="259.0" y="485" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Closing session; day orders cancelled by the exchange; margin blocks released</text>
  <rect x="30" y="506" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="white">15:30+</text>
  <rect x="176" y="506" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="532" text-anchor="start" font-size="11" font-weight="700" fill="#166534">Trade import</text>
  <text x="316.4" y="532" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Exchange files retrieved; counts asserted; three-way reconciliation — a difference blocks contract notes</text>
  <rect x="30" y="553" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="white">Evening</text>
  <rect x="176" y="553" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="579" text-anchor="start" font-size="11" font-weight="700" fill="#166534">Contract notes</text>
  <text x="332.79999999999995" y="579" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Generated, DSC-signed, dispatched — within 24 hours of execution</text>
  <rect x="30" y="600" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="626" text-anchor="middle" font-size="11" font-weight="700" fill="white">Evening</text>
  <rect x="176" y="600" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="626" text-anchor="start" font-size="11" font-weight="700" fill="#166534">Obligations</text>
  <text x="308.2" y="626" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Final obligation loaded T+1; client-level allocation; shortfalls identified early</text>
  <rect x="30" y="647" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="673" text-anchor="middle" font-size="11" font-weight="700" fill="white">Evening</text>
  <rect x="176" y="647" width="1314" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="673" text-anchor="start" font-size="11" font-weight="700" fill="#9a3412">Settlement and pay-out</text>
  <text x="398.4" y="673" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Pay-in before the bank cut-off; pay-out received into A3, to A2, disbursed the same day</text>
  <rect x="30" y="694" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="720" text-anchor="middle" font-size="11" font-weight="700" fill="white">Evening</text>
  <rect x="176" y="694" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="720" text-anchor="start" font-size="11" font-weight="700" fill="#166534">CUSPA</text>
  <text x="259.0" y="720" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Auto-pledge at pay-out; daily maximum recomputed; excess released by the next trading day</text>
  <rect x="30" y="741" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="767" text-anchor="middle" font-size="11" font-weight="700" fill="white">19:30</text>
  <rect x="176" y="741" width="1314" height="42" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="767" text-anchor="start" font-size="11" font-weight="700" fill="#1e293b">Commodity tender</text>
  <text x="349.2" y="767" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Delivery intentions through MCXCCL eClear — a hard deadline on tender days</text>
  <rect x="30" y="788" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="814" text-anchor="middle" font-size="11" font-weight="700" fill="white">EOD</text>
  <rect x="176" y="788" width="1314" height="42" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="814" text-anchor="start" font-size="11" font-weight="700" fill="#9a3412">Upstreaming</text>
  <text x="308.2" y="814" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Clear credit balances to the clearing corporations — cash, FDR lien, or MFOS pledge</text>
  <rect x="30" y="835" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="861" text-anchor="middle" font-size="11" font-weight="700" fill="white">EOD</text>
  <rect x="176" y="835" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="861" text-anchor="start" font-size="11" font-weight="700" fill="#166534">Margin reporting</text>
  <text x="349.2" y="861" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Client-wise margin collected and peak; cut-off five working days after trade date</text>
  <rect x="30" y="882" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="908" text-anchor="middle" font-size="11" font-weight="700" fill="white">EOD</text>
  <rect x="176" y="882" width="1314" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="908" text-anchor="start" font-size="11" font-weight="700" fill="#991b1b">Extract to RMS</text>
  <text x="332.79999999999995" y="908" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Collateral and balance for tomorrow — this blocks the next open</text>
  <rect x="30" y="929" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="955" text-anchor="middle" font-size="11" font-weight="700" fill="white">23:30</text>
  <rect x="176" y="929" width="1314" height="42" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="955" text-anchor="start" font-size="11" font-weight="700" fill="#1e293b">Commodity close</text>
  <text x="341.0" y="955" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  MCX session ends, or 23:55 in US daylight saving; a separate close checklist follows</text>
  <rect x="30" y="976" width="132" height="42" rx="7" fill="#1e293b"/>
  <text x="96" y="1002" text-anchor="middle" font-size="11" font-weight="700" fill="white">Overnight</text>
  <rect x="176" y="976" width="1314" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="196" y="1002" text-anchor="start" font-size="11" font-weight="700" fill="#166534">Reconciliation</text>
  <text x="332.79999999999995" y="1002" text-anchor="start" font-size="9.8" font-weight="400" fill="#475569">—  Bank, gateway, depository, pledges; exception ageing is the metric, not count</text>
  <rect x="30" y="1033" width="1460" height="82" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="48" y="1057" text-anchor="start" font-size="11.5" font-weight="700" fill="#991b1b">The gates are refusals, scoped as narrowly as the missing fact allows</text>
  <text x="48" y="1077" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">A stale instrument master, or an as-of timestamp that is not today&#x27;s, aborts the open entirely. A missed risk-parameter publication blocks new derivatives orders in that segment only.</text>
  <text x="48" y="1095" text-anchor="start" font-size="10" font-weight="400" fill="#7f1d1d">A stale price blocks market orders in that instrument only. Fail closed, but fail narrowly — a system that stops everything for any reason gets configured permissive by the people who run it.</text>
</svg>
